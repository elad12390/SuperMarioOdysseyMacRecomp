name: Source checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: |
          brew install ffmpeg
          bun install --cwd tools/browser-builder --frozen-lockfile
          bun install --cwd tools/browser-builder/signing --frozen-lockfile
          bun install --cwd tools/browser-builder/dmg --frozen-lockfile
          bun install --cwd tools/game-harness --frozen-lockfile
      - name: Check the website and harness
        run: |
          bun run --cwd tools/browser-builder typecheck
          bun run --cwd tools/game-harness check
          bun run --cwd tools/browser-builder test
          bun test ./tools/browser-builder/pipeline/shaders/test/asset-loader.test.mjs ./tools/browser-builder/pipeline/shaders/test/yaz0.test.mjs ./tools/browser-builder/pipeline/shaders/test/parallel.test.mjs
          bun test ./tools/browser-builder/dmg/test
