name: Browser release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/browser-release.yml
      - tools/browser-builder/**
      - "!tools/browser-builder/**/*.md"
      - scripts/patches/**

permissions:
  contents: read

concurrency:
  group: browser-pages-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      SWITCHRECOMP_REPOSITORY_URL: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.402
      - name: Install developer toolchains
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          brew install uv ffmpeg gnu-tar
          dotnet workload install wasm-tools --skip-manifest-update
          mkdir -p tmp/odyssey/browser-ci
          git clone --depth 1 --branch 6.0.13 https://github.com/emscripten-core/emsdk.git tmp/odyssey/browser-ci/emsdk
          test "$(git -C tmp/odyssey/browser-ci/emsdk rev-parse HEAD)" = 35659964bc2762fffec0d257997fb61475f765b7
          tmp/odyssey/browser-ci/emsdk/emsdk install 6.0.13
          tmp/odyssey/browser-ci/emsdk/emsdk activate 6.0.13
      - name: Prepare pinned open-source runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external/nxnative
          git -C external/nxnative init
          git -C external/nxnative remote add origin https://github.com/seedds/nxnative.git
          git -C external/nxnative fetch --depth 1 origin 0045c1dfb639f9775891382646ad38c2a11c56bf
          git -C external/nxnative checkout --detach FETCH_HEAD
          git -C external/nxnative apply ../../scripts/patches/nxnative-odyssey-sdk3.patch
      - name: Install browser build dependencies
        shell: bash
        run: |
          set -euo pipefail
          bun install --cwd tools/browser-builder --frozen-lockfile
          bun install --cwd tools/browser-builder/signing --frozen-lockfile
          bun install --cwd tools/game-harness --frozen-lockfile
      - name: Verify source and browser components
        shell: bash
        run: |
          set -euo pipefail
          bun run --cwd tools/browser-builder typecheck
          bun run --cwd tools/browser-builder test
          bun test ./tools/browser-builder/pipeline/shaders/test/asset-loader.test.mjs ./tools/browser-builder/pipeline/shaders/test/yaz0.test.mjs ./tools/browser-builder/pipeline/shaders/test/parallel.test.mjs
          (cd tools/browser-builder/dmg && bun install --frozen-lockfile && bun test ./test)
      - name: Build static tools and matching ARM64 template
        shell: bash
        run: |
          set -euo pipefail
          source tmp/odyssey/browser-ci/emsdk/emsdk_env.sh
          bun run --cwd tools/browser-builder build:release
          bun run --cwd tools/browser-builder build:release --reuse-tools --reuse-runtime
          bun -e 'const r=await Bun.file("tmp/odyssey/browser-release-tools/release-latest.json").json(); if(r.toolsBuildRan || r.runtimeBuildRan) throw new Error("Reuse rebuilt native/tool assets");'
          SWITCHRECOMP_RUNTIME_PUBLIC="$(bun -e 'console.log((await Bun.file("tmp/odyssey/browser-release-tools/release-latest.json").json()).runtimeDirectory)')"
          export SWITCHRECOMP_RUNTIME_PUBLIC
          bun run --cwd tools/browser-builder/signing test
          bun test ./tools/browser-builder/runtime/tests/portable.test.ts
          bun tools/browser-builder/tests/release-reuse.mjs --runtime "$SWITCHRECOMP_RUNTIME_PUBLIC"
          PUBLIC_MARKER_ASSET_ROOT="$PWD/tmp/odyssey/browser-release-tools/build-root" bun tools/browser-builder/release/tests/public-marker.test.mjs
      - name: Upload only public static artifacts
        uses: actions/upload-pages-artifact@v4
        with:
          path: tools/browser-builder/dist
      - name: Preserve compact build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-build-diagnostics
          path: |
            tmp/odyssey/browser-release-tools/build-plan.json
            tmp/odyssey/browser-release-tools/build-jobs/*.log
            tmp/odyssey/browser-release-tools/build-jobs/*.status
            tmp/odyssey/browser-release-tools/build-release/**/assembly.status
            tmp/odyssey/browser-release-tools/build-release/**/jobs/**/*.log
            tmp/odyssey/browser-release-tools/build-release/**/jobs/**/*.status
            tmp/odyssey/browser-release-tools/build-release/**/result.json
            tmp/odyssey/browser-release-tools/recipe-probes/**/*.log
            tmp/odyssey/browser-release-tools/recipe-probes/**/*.status
            tmp/odyssey/browser-release-tools/release-latest.json
          if-no-files-found: ignore

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy static browser builder
        id: deployment
        uses: actions/deploy-pages@v4
